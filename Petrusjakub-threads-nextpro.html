        const STATE_KEY = 'petrusjakub_nextpro_content_state';

        function getState() {
            const saved = localStorage.getItem(STATE_KEY);
            return saved ? JSON.parse(saved) : {};
        }

        function saveState(state) {
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        function updateStats() {
            const state = getState();
            const total = posts.length;
            const done = Object.values(state).filter(s => s === 'done' || s === 'hidden').length;
            const remaining = total - done;
            const percent = Math.round((done / total) * 100);

            document.getElementById('totalPosts').textContent = total;
            document.getElementById('donePosts').textContent = done;
            document.getElementById('remainingPosts').textContent = remaining;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '% selesai';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyCaption(index) {
            const text = posts[index].caption;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn-' + index);
                btn.textContent = 'Tersalin!';
                btn.classList.add('copied');
                showToast('Caption berhasil disalin!');
                setTimeout(() => {
                    btn.textContent = '1-Click Copy';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Caption berhasil disalin!');
            });
        }

        function markDone(index) {
            const state = getState();
            state[index] = 'done';
            saveState(state);
            const card = document.getElementById('post-' + index);
            card.classList.add('done');
            updateNavButtons();
            updateStats();
            showToast('Ditandai selesai!');
        }

        function hideTask(index) {
            const state = getState();
            state[index] = 'hidden';
            saveState(state);
            const card = document.getElementById('post-' + index);
            card.classList.add('hidden');
            updateNavButtons();
            updateStats();
            showToast('Task disembunyikan!');
        }

        function showAllTasks() {
            localStorage.removeItem(STATE_KEY);
            renderPosts();
            showToast('Semua task ditampilkan!');
        }

        function resetAll() {
            if (confirm('Reset semua task? Status selesai dan hidden akan dihapus.')) {
                localStorage.removeItem(STATE_KEY);
                renderPosts();
                showToast('Semua task direset!');
            }
        }

        function scrollToPost(index) {
            const card = document.getElementById('post-' + index);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.boxShadow = '0 0 20px rgba(240, 147, 251, 0.4)';
                setTimeout(() => {
                    card.style.boxShadow = '';
                }, 2000);
            }
        }

        function updateNavButtons() {
            const state = getState();
            const navContainer = document.getElementById('navButtons');
            navContainer.innerHTML = '';

            posts.forEach((post, index) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.textContent = post.time;
                btn.onclick = () => scrollToPost(index);

                const status = state[index] || '';
                if (status === 'done') {
                    btn.classList.add('nav-done');
                } else if (status === 'hidden') {
                    btn.classList.add('nav-hidden');
                }

                navContainer.appendChild(btn);
            });
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const state = getState();
            container.innerHTML = '';

            posts.forEach((post, index) => {
                const status = state[index] || '';
                const card = document.createElement('div');
                card.className = 'post-card' + (status === 'done' ? ' done' : '') + (status === 'hidden' ? ' hidden' : '');
                card.id = 'post-' + index;

                card.innerHTML = `
                    <div class="post-header">
                        <span class="post-time">${post.time} WIB</span>
                        <span class="post-number">#${index + 1} / ${posts.length}</span>
                    </div>
                    <span class="post-type">${post.type}</span>
                    <div class="post-caption">${post.caption}</div>
                    <div class="post-actions">
                        <button class="btn btn-copy" id="copy-btn-${index}" onclick="copyCaption(${index})">1-Click Copy</button>
                        <button class="btn btn-done" onclick="markDone(${index})">Selesai</button>
                        <button class="btn btn-hide" onclick="hideTask(${index})">Hide Task</button>
                    </div>
                `;

                container.appendChild(card);
            });

            updateNavButtons();
            updateStats();
        }

        // Initialize
        renderPosts();
    </script>
</body>
