    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

            min-height: 100vh;
            color: #e0e0e0;
            padding: 16px;
        }

        .header {
            text-align: center;
            padding: 24px 16px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(90deg, #1877F2, #4267B2, #898F9C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #8892b0;
            font-size: 0.95rem;
        }

        .header .account {
            color: #1877F2;
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 4px;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        .stat-item span {
            color: #1877F2;
            font-weight: 700;
        }

        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
        }

        .nav-buttons .nav-title {
            width: 100%;
            text-align: center;
            color: #8892b0;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .nav-btn {
            background: rgba(24, 119, 242, 0.15);
            border: 1px solid rgba(24, 119, 242, 0.3);
            color: #1877F2;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .nav-btn:hover {
            background: rgba(24, 119, 242, 0.3);
            transform: translateY(-2px);
        }

        .nav-btn.nav-hidden {
            opacity: 0.3;
            pointer-events: none;
        }

            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #1877F2, #4267B2, #5B7BD5);
            border-radius: 4px 0 0 4px;
        }

        .post-card.done {
            opacity: 0.3;
            transform: scale(0.98);
        }

        .post-card.hidden {
            display: none;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .post-time {
            background: linear-gradient(135deg, #1877F2, #4267B2);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .post-number {
            color: #8892b0;
            font-size: 0.8rem;
        }

        .post-type {
            display: inline-block;
            background: rgba(24, 119, 242, 0.1);
            color: #1877F2;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-bottom: 10px;
        }

        .post-caption {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ccd6f6;
            white-space: pre-wrap;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .post-image-prompt {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #a8b2d1;
            white-space: pre-wrap;
            margin-bottom: 12px;
            padding: 12px;
            background: rgba(24, 119, 242, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(24, 119, 242, 0.2);
        }

        .post-image-prompt .prompt-label {
            display: block;
            color: #1877F2;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .pinterest-links {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #a8b2d1;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(230, 0, 35, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(230, 0, 35, 0.2);
        }

        .pinterest-links .pinterest-label {
            display: block;
            color: #E60023;
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .pinterest-links a {
            color: #E60023;
            text-decoration: none;
            display: block;
            margin-bottom: 4px;
            font-size: 0.82rem;
        }

        .pinterest-links a:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        .post-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy {
            background: linear-gradient(135deg, #1877F2, #4267B2);
            color: #fff;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(24, 119, 242, 0.3);
        }

        .btn-copy.copied {
            background: linear-gradient(135deg, #00c853, #64dd17);
        }

        .btn-copy-prompt {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            color: #fff;
        }

        .btn-copy-prompt:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
        }

        .btn-copy-prompt.copied {
            background: linear-gradient(135deg, #00c853, #64dd17);
        }

        .btn-done {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }

        .btn-done:hover {
            background: rgba(100, 255, 218, 0.2);
            transform: translateY(-2px);
        }

        .btn-hide {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
            border: 1px solid rgba(255, 82, 82, 0.4);
            font-weight: 700;
        }

        .btn-hide:hover {
            background: rgba(255, 82, 82, 0.3);
            transform: translateY(-2px);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.05);
            color: #8892b0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 24px auto;
            display: block;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #00c853;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 1000;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 200, 83, 0.3);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .progress-bar {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            height: 8px;
            margin: 16px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1877F2, #4267B2, #5B7BD5);
            border-radius: 20px;
            transition: width 0.5s ease;
        }

        .progress-text {
            text-align: center;
            color: #8892b0;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .post-card {
                padding: 16px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .nav-btn {
                padding: 5px 9px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

        const STATE_KEY = 'fb_anindita_content_state';

        function getState() {
            const saved = localStorage.getItem(STATE_KEY);
            return saved ? JSON.parse(saved) : {};
        }

        function saveState(state) {
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        function updateStats() {
            const state = getState();
            const total = posts.length;
            const done = Object.values(state).filter(s => s === 'done' || s === 'hidden').length;
            const remaining = total - done;
            const percent = Math.round((done / total) * 100);

            document.getElementById('totalPosts').textContent = total;
            document.getElementById('donePosts').textContent = done;
            document.getElementById('remainingPosts').textContent = remaining;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '% selesai';

            updateNavButtons();
        }

        function updateNavButtons() {
            const state = getState();
            posts.forEach((post, index) => {
                const navBtn = document.getElementById('nav-btn-' + index);
                if (navBtn) {
                    const status = state[index] || '';
                    if (status === 'hidden') {
                        navBtn.classList.add('nav-hidden');
                    } else {
                        navBtn.classList.remove('nav-hidden');
                    }
                }
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function scrollToTask(index) {
            const card = document.getElementById('post-' + index);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.boxShadow = '0 0 20px rgba(24, 119, 242, 0.5)';
                setTimeout(() => { card.style.boxShadow = ''; }, 2000);
            }
        }

        function copyCaption(index) {
            const text = posts[index].caption;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn-' + index);
                btn.textContent = 'Tersalin!';
                btn.classList.add('copied');
                showToast('Caption berhasil disalin!');
                setTimeout(() => {
                    btn.textContent = '1-Click Copy Caption';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Caption berhasil disalin!');
            });
        }

        function copyImagePrompt(index) {
            const text = posts[index].imagePrompt;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-prompt-btn-' + index);
                btn.textContent = 'Tersalin!';
                btn.classList.add('copied');
                showToast('Image prompt berhasil disalin!');
                setTimeout(() => {
                    btn.textContent = '1-Click Copy Prompt';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Image prompt berhasil disalin!');
            });
        }

        function markDone(index) {
            const state = getState();
            state[index] = 'done';
            saveState(state);
            const card = document.getElementById('post-' + index);
            card.classList.add('done');
            updateStats();
            showToast('Ditandai selesai!');
        }

        function hideTask(index) {
            const state = getState();
            state[index] = 'hidden';
            saveState(state);
            const card = document.getElementById('post-' + index);
            card.classList.add('hidden');
            updateStats();
            showToast('Task disembunyikan!');
        }

        function resetAll() {
            if (confirm('Reset semua task? Status selesai dan hidden akan dihapus.')) {
                localStorage.removeItem(STATE_KEY);
                renderPosts();
                showToast('Semua task direset!');
            }
        }

        function renderNavButtons() {
            const nav = document.getElementById('navButtons');
            const state = getState();
            let buttonsHTML = '<div class="nav-title">Go To Task:</div>';

            posts.forEach((post, index) => {
                const status = state[index] || '';
                const hiddenClass = status === 'hidden' ? ' nav-hidden' : '';
                buttonsHTML += `<button class="nav-btn${hiddenClass}" id="nav-btn-${index}" onclick="scrollToTask(${index})">Task ${index + 1} (${post.time})</button>`;
            });

            nav.innerHTML = buttonsHTML;
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const state = getState();
            container.innerHTML = '';

            posts.forEach((post, index) => {
                const status = state[index] || '';
                const card = document.createElement('div');
                card.className = 'post-card' + (status === 'done' ? ' done' : '') + (status === 'hidden' ? ' hidden' : '');
                card.id = 'post-' + index;

                let pinterestHTML = '';
                if (post.pinterestLinks && post.pinterestLinks.length > 0) {
                    pinterestHTML = `<div class="pinterest-links"><span class="pinterest-label">Pinterest Reference Links</span>`;
                    post.pinterestLinks.forEach(link => {
                        pinterestHTML += `<a href="${link.url}" target="_blank">${link.label}</a>`;
                    });
                    pinterestHTML += `</div>`;
                }

                card.innerHTML = `
                    <div class="post-header">
                        <span class="post-time">${post.time} WIB</span>
                        <span class="post-number">#${index + 1} / ${posts.length}</span>
                    </div>
                    <span class="post-type">${post.type}</span>
                    <div class="post-caption">${post.caption}</div>
                    <div class="post-image-prompt"><span class="prompt-label">Image Prompt</span>${post.imagePrompt}</div>
                    ${pinterestHTML}
                    <div class="post-actions">
                        <button class="btn btn-copy" id="copy-btn-${index}" onclick="copyCaption(${index})">1-Click Copy Caption</button>
                        <button class="btn btn-copy-prompt" id="copy-prompt-btn-${index}" onclick="copyImagePrompt(${index})">1-Click Copy Prompt</button>
                        <button class="btn btn-done" onclick="markDone(${index})">Selesai</button>
                        <button class="btn btn-hide" onclick="hideTask(${index})">Hide Task</button>
                    </div>
                `;

                container.appendChild(card);
            });

            renderNavButtons();
            updateStats();
        }

        // Initialize
        renderPosts();
    </script>
