        function getState() {
            const saved = localStorage.getItem('ngobras_santuy_ig_state');
            return saved ? JSON.parse(saved) : {};
        }

        function saveState(state) {
            localStorage.setItem('ngobras_santuy_ig_state', JSON.stringify(state));
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function updateProgress() {
            const state = getState();
            const done = Object.values(state).filter(v => v === true).length;
            const total = posts.length;
            const pct = (done / total) * 100;
            document.getElementById('progress-fill').style.width = pct + '%';
            document.getElementById('progress-text').textContent = done + ' / ' + total + ' selesai';

            // Update nav buttons
            posts.forEach(post => {
                const navBtn = document.getElementById('nav-' + post.id);
                if (navBtn) {
                    if (state[post.id]) {
                        navBtn.classList.add('done');
                    } else {
                        navBtn.classList.remove('done');
                    }
                }
            });
        }

        function hideTask(id) {
            const state = getState();
            state[id] = true;
            saveState(state);
            const card = document.getElementById('task-' + id);
            if (card) card.classList.add('hidden-task');
            updateProgress();
            showToast('Post #' + id + ' ditandai selesai!');
        }

        function copyText(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(label + ' berhasil di-copy!');
            }).catch(() => {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast(label + ' berhasil di-copy!');
            });
        }

        function resetAll() {
            if (confirm('Reset semua progress? Semua post akan muncul kembali.')) {
                localStorage.removeItem('ngobras_santuy_ig_state');
                document.querySelectorAll('.task-card').forEach(card => {
                    card.classList.remove('hidden-task');
                });
                updateProgress();
                showToast('Progress direset!');
            }
        }

        function renderNav() {
            const container = document.getElementById('nav-buttons');
            let html = '';
            posts.forEach(post => {
                html += `<a href="#task-${post.id}" class="nav-btn" id="nav-${post.id}" onclick="document.getElementById('task-${post.id}').scrollIntoView({behavior:'smooth'})">${post.time}</a>`;
            });
            container.innerHTML = html;
        }

        function renderTasks() {
            const container = document.getElementById('tasks-container');
            const state = getState();
            let html = '';
            posts.forEach(post => {
                const hiddenClass = state[post.id] ? 'hidden-task' : '';
                html += `
                <div class="task-card ${hiddenClass}" id="task-${post.id}">
                    <div class="task-header">
                        <span class="task-time">${post.time}</span>
                        <span class="task-type ${post.typeClass}">${post.type}</span>
                    </div>
                    <div class="task-section">
                        <div class="task-section-label">Caption</div>
                        <div class="caption-text">${post.caption}</div>
                    </div>
                    <div class="task-section">
                        <div class="task-section-label">Image/Video Prompt</div>
                        <div class="prompt-text">${post.imagePrompt}</div>
                    </div>
                    <div class="btn-group">
                        <button class="copy-btn copy-caption-btn" onclick="copyText(posts[${post.id - 1}].caption, 'Caption')">📋 Copy Caption</button>
                        <button class="copy-btn copy-prompt-btn" onclick="copyText(posts[${post.id - 1}].imagePrompt, 'Prompt')">🎨 Copy Prompt</button>
                        <button class="copy-btn hide-btn" onclick="hideTask(${post.id})">✅ Selesai</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // Initialize
        renderNav();
        renderTasks();
        updateProgress();
    </script>
