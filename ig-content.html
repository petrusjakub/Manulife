        const STATE_KEY = 'ig_content_state';

        function getState() {
            const saved = localStorage.getItem(STATE_KEY);
            return saved ? JSON.parse(saved) : {};
        }

        function saveState(state) {
            localStorage.setItem(STATE_KEY, JSON.stringify(state));
        }

        function updateStats() {
            const state = getState();
            const total = posts.length;
            const done = Object.values(state).filter(s => s === 'hidden').length;
            const remaining = total - done;
            const percent = Math.round((done / total) * 100);

            document.getElementById('totalPosts').textContent = total;
            document.getElementById('donePosts').textContent = done;
            document.getElementById('remainingPosts').textContent = remaining;
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '% selesai';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyCaption(index) {
            const text = posts[index].caption;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn-' + index);
                btn.textContent = 'Tersalin!';
                btn.classList.add('copied');
                showToast('Caption berhasil disalin!');
                setTimeout(() => {
                    btn.textContent = '1-Click Copy';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('Caption berhasil disalin!');
            });
        }

        function hideTask(index) {
            const state = getState();
            state[index] = 'hidden';
            saveState(state);
            const card = document.getElementById('post-' + index);
            card.classList.add('hidden');
            updateStats();
            showToast('Task disembunyikan!');
        }

        function resetAll() {
            if (confirm('Reset semua task? Semua task yang disembunyikan akan muncul kembali.')) {
                localStorage.removeItem(STATE_KEY);
                renderPosts();
                showToast('Semua task direset!');
            }
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const state = getState();
            container.innerHTML = '';

            posts.forEach((post, index) => {
                const status = state[index] || '';
                const card = document.createElement('div');
                card.className = 'post-card' + (status === 'hidden' ? ' hidden' : '');
                card.id = 'post-' + index;

                card.innerHTML = `
                    <div class="post-actions-top">
                        <button class="btn btn-copy" id="copy-btn-${index}" onclick="copyCaption(${index})">1-Click Copy</button>
                        <button class="btn btn-hide" onclick="hideTask(${index})">Sembunyikan</button>
                    </div>
                    <div class="post-header">
                        <span class="post-time">${post.time} WIB</span>
                        <span class="post-number">#${index + 1} / ${posts.length}</span>
                    </div>
                    <span class="post-type">${post.type}</span>
                    <div class="post-caption">${post.caption}</div>
                    <div class="image-prompt-section">
                        <div class="image-prompt-label">Prompt Image / Visual</div>
                        <div class="image-prompt-text">${post.imagePrompt}</div>
                    </div>
                `;

                container.appendChild(card);
            });

            updateStats();
        }

        renderPosts();
    </script>
