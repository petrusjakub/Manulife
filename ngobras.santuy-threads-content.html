        const STORAGE_KEY = 'ngobras-santuy-threads-v2';

        function getState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            return saved ? JSON.parse(saved) : {};
        }

        function saveState(state) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function updateStats() {
            const state = getState();
            const total = posts.length;
            const done = Object.values(state).filter(s => s === 'done').length;
            const hidden = Object.values(state).filter(s => s === 'hidden').length;
            const remaining = total - done - hidden;

            document.getElementById('totalPosts').textContent = total;
            document.getElementById('donePosts').textContent = done;
            document.getElementById('remainingPosts').textContent = remaining;

            const percent = Math.round((done / total) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressText').textContent = percent + '% selesai';
        }

        function updateNavButtons() {
            const state = getState();
            posts.forEach((_, i) => {
                const btn = document.getElementById(`nav-btn-${i}`);
                if (!btn) return;
                btn.classList.remove('nav-done', 'nav-hidden');
                if (state[i] === 'done') btn.classList.add('nav-done');
                if (state[i] === 'hidden') btn.classList.add('nav-hidden');
            });
        }

        function copyCaption(index) {
            const text = posts[index].caption;
            const btn = document.querySelector(`#post-${index} .btn-copy`);

            function onSuccess() {
                btn.classList.add('copied');
                btn.innerHTML = '&#10003; Tersalin';
                showToast('Caption tersalin!');
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.innerHTML = '&#128203; Copy';
                }, 2000);
            }

            function fallbackCopy() {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                try {
                    document.execCommand('copy');
                    onSuccess();
                } catch (err) {
                    showToast('Gagal menyalin, coba lagi');
                }
                document.body.removeChild(textarea);
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(onSuccess).catch(fallbackCopy);
            } else {
                fallbackCopy();
            }
        }

        function markDone(index) {
            const state = getState();
            state[index] = 'done';
            saveState(state);
            const card = document.getElementById(`post-${index}`);
            card.classList.add('done');
            updateStats();
            updateNavButtons();
            showToast('Ditandai selesai!');
        }

        function hidePost(index) {
            const state = getState();
            state[index] = 'hidden';
            saveState(state);
            const card = document.getElementById(`post-${index}`);
            card.classList.add('hidden');
            updateStats();
            updateNavButtons();
            showToast('Post disembunyikan');
        }

        function scrollToPost(index) {
            const card = document.getElementById(`post-${index}`);
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
                card.style.boxShadow = '0 0 20px rgba(255, 154, 0, 0.5)';
                setTimeout(() => { card.style.boxShadow = ''; }, 2000);
            }
        }

        function resetAll() {
            if (confirm('Reset semua progress? Data akan hilang.')) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            const navScroll = document.getElementById('navScroll');
            const state = getState();

            // Render nav buttons
            navScroll.innerHTML = posts.map((post, i) => {
                let cls = 'nav-btn';
                if (state[i] === 'done') cls += ' nav-done';
                if (state[i] === 'hidden') cls += ' nav-hidden';
                return `<button class="${cls}" id="nav-btn-${i}" onclick="scrollToPost(${i})">#${i + 1} ${post.time}</button>`;
            }).join('');

            // Render post cards
            container.innerHTML = posts.map((post, i) => {
                let cls = 'post-card';
                if (state[i] === 'done') cls += ' done';
                if (state[i] === 'hidden') cls += ' hidden';
                return `
                    <div class="${cls}" id="post-${i}">
                        <div class="post-header">
                            <span class="post-time">${post.time}</span>
                            <span class="post-number">#${i + 1} / ${posts.length}</span>
                        </div>
                        <span class="post-type">${post.type}</span>
                        <div class="post-caption">${post.caption}</div>
                        <div class="post-actions">
                            <button class="btn btn-copy" onclick="copyCaption(${i})">&#128203; Copy</button>
                            <button class="btn btn-done" onclick="markDone(${i})">&#10003; Selesai</button>
                            <button class="btn btn-hide" onclick="hidePost(${i})">&#128065; Sembunyikan</button>
                        </div>
                    </div>
                `;
            }).join('');

            updateStats();
        }

        renderPosts();
    </script>
</body>
</html>
